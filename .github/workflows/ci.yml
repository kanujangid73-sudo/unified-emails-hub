name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # The same suite against real Postgres, the production database.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mailhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mailhub_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # Sync and query timings on real Postgres, shown in the run's summary page.
      - name: Benchmark (20,000 messages)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mailhub_test
        run: python -m scripts.benchmark --messages 20000

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Redeploy on Render after the tests pass on main, only for the parts that changed.
  # Needs the repository secrets RENDER_DEPLOY_HOOK_API and RENDER_DEPLOY_HOOK_WEB
  # (each service's Settings -> Deploy Hook on Render). See docs/DEPLOY.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, backend-postgres, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - "backend/**"
              - "render.yaml"
            web:
              - "frontend/**"
              - "render.yaml"
      - name: Deploy API
        if: steps.changes.outputs.api == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then echo "::notice::RENDER_DEPLOY_HOOK_API is not set, skipping"; exit 0; fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null && echo "API deploy triggered"
      - name: Deploy web app
        if: steps.changes.outputs.web == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then echo "::notice::RENDER_DEPLOY_HOOK_WEB is not set, skipping"; exit 0; fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null && echo "Web app deploy triggered"
